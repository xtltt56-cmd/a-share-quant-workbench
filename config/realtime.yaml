realtime:
  provider_priority:
    - rqdata
    - tushare
    - akshare
  poll_interval_seconds: 15
  minute_frequency: 1m
  stale_threshold:
    professional_feed_seconds: 10
    public_fallback_seconds: 60
  retry:
    max_attempts: 3
  backoff:
    initial_seconds: 0.5
    multiplier: 2.0
    max_seconds: 8.0
  market_indices:
    - "000001"
    - "000300"
    - "000905"
    - "000852"
    - "399001"
    - "399006"
  candidate_count: 20
  dashboard_refresh_seconds: 15
  market_hours:
    timezone: Asia/Shanghai
    pre_market_start: "09:00"
    open_start: "09:30"
    morning_end: "11:30"
    afternoon_start: "13:00"
    close_end: "15:00"
  trigger:
    ready_score_min: 70
    watch_score_min: 55
    overheated_return_pct: 8
    overheated_volume_ratio: 3
    max_data_age_seconds: 60
    min_volume_ratio: 0.8
    max_single_position: 0.15
  fallback:
    enabled: true
    label: "AKShare Public Market Source"
  transport:
    use_system_proxy: true
    isolated_transport_authorized: false
  live_validation:
    minimum_distinct_updates: 2
    telemetry_latency_samples: 256
  eod:
    wait_seconds: 30
    confirmation_timeout_seconds: 300
    finalization_enabled: true
