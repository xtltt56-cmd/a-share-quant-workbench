[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant"
version = "0.1.0"
description = "Framework-first A-share quantitative research and paper-trading system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18,<2",
    "duckdb>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "pyarrow>=16,<24",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]
research = [
    "pyqlib>=0.9.7,<0.10",
    "optuna>=4,<5",
    "quantstats>=0.0.8,<1",
]
fast-research = [
    "vectorbt>=0.28,<1",
]
event-backtest = [
    "rqalpha>=6.3,<7",
]
portfolio = [
    "PyPortfolioOpt>=1.5,<2",
]
data-extra = [
    "tushare>=1.4,<2",
]
data-free = [
    "baostock>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
