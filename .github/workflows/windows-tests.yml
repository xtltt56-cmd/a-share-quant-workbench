name: Windows tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and test dependencies
        run: >-
          python -m pip install -e ".[dev,data-free]" lightgbm scikit-learn
          -c constraints/runtime-py312.txt
      - name: Verify environment
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
